[project]
name = "animal-shelter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Wouter Leunisse", email = "w.leunisse@hotmail.nl" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "pandas>=3.1.1",
]

[project.scripts]
animal-shelter = "animal_shelter:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7.0",
    "ruff>=0.17.6",
]

[tool.ruff.lint]
extend-select = [
  "UP", # pyupgrade
  "D",  # pydocstyle
  "N",  # PEP8 names
  "I"  # isort
]

[tool.ruff]
exclude = [
    "03_quality_checks.ipynb"
     ]
